# Test-only overlay: adds a mock LLM that plays a hijacked model (mock_llm.py).
# Use on top of docker-compose.yml + hardening/docker-compose.hardened.yml +
# hardening/sandbox/compose.fw-test.yml.
services:
  mockllm:
    image: python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
    command: ["python3", "/mock/mock_llm.py"]
    volumes:
      - ./hardening/sandbox/mock_llm.py:/mock/mock_llm.py:ro
      - mocklog:/log

  egress-fw:
    environment:
      FW_INTERNAL_HOSTS: postgres

volumes:
  mocklog: {}
